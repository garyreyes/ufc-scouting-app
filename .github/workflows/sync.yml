name: Sync UFC data

on:
  schedule:
    # 00:00 UTC / 08:00 PHT and 12:00 UTC / 20:00 PHT. Picks get finalized
    # Fri/Sat evening PHT depending on card day, so a single morning-only
    # run could be ~12h stale by then (late replacements, schedule
    # changes). Two runs/day is still cheap against API-Sports' 100
    # req/day free-tier cap.
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync recent results (API-Sports)
        run: npx tsx src/lib/ufc-data-sync/syncJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UFC_API_SPORTS_KEY: ${{ secrets.UFC_API_SPORTS_KEY }}

      - name: Sync upcoming schedule (Wikipedia)
        run: npx tsx src/lib/ufc-data-sync/syncSchedule.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # D1 + D2 (ARCHITECTURE.md Fork 6): runs after both syncs above, on
      # the same cadence, since it evaluates whatever each source just
      # wrote to its own per-source columns (fights.wikipedia_*/
      # api_sports_*). D1 settles agreements and 24h-timed-out
      # single-source results, queues genuine disagreements; D2 then
      # writes pick_correct/pnl_units onto every pick whose fight just
      # settled.
      - name: Settlement (fights, then picks)
        run: npx tsx src/lib/settlement/runSettlementJobs.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
