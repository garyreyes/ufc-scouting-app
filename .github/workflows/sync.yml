name: Sync UFC data

on:
  schedule:
    # 00:00 UTC / 08:00 PHT and 12:00 UTC / 20:00 PHT. Picks get finalized
    # Fri/Sat evening PHT depending on card day, so a single morning-only
    # run could be ~12h stale by then (late replacements, schedule
    # changes). Two runs/day is still cheap against API-Sports' 100
    # req/day free-tier cap.
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

# M4: shared with settle.yml (and sherdog.yml) -- all three write
# overlapping tables (fights, picks, fighters, fighter_elo_history) and
# must never run concurrently. Queues rather than cancels.
concurrency:
  group: ufc-data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync recent results (API-Sports)
        run: npx tsx src/lib/ufc-data-sync/syncJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UFC_API_SPORTS_KEY: ${{ secrets.UFC_API_SPORTS_KEY }}

      - name: Sync upcoming schedule (Wikipedia)
        run: npx tsx src/lib/ufc-data-sync/syncSchedule.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # M3: right after the schedule sync, while any disputed_opponent
      # conflicts it just opened are still fresh -- auto-merges a genuine
      # same-card name variant (e.g. Wikipedia renaming "Jose Delgado" to
      # "Jose Miguel Delgado" mid-card) instead of leaving "keep existing"
      # to record nothing and the identical dispute to reopen next run.
      - name: Resolve same-card fighter name variants
        run: npx tsx src/lib/ufc-data-sync/runResolveSameCardNameVariantsJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # P7 (ROADMAP_V2.md Phase P): the SAME job sherdog.yml already runs
      # once daily at 03:00 UTC, chained here too so a fighter created by
      # either sync above is Sherdog-linked in the SAME cycle that creates
      # them, not up to ~15h later on tomorrow's cron. That gap is what let
      # the odds job (every 2h) act on a name-only, unresolved fighter
      # first and produce the Choi Doo-ho duplicate this whole phase traces
      # back to. Runs after the name-variant resolution above on purpose:
      # a genuine duplicate that step already merges never reaches this job
      # as two rows to begin with, so this only ever spends a Sherdog
      # search on the real residual. No new API budget -- Sherdog is
      # unmetered (sherdog.yml's own comment) -- just the same calls,
      # earlier. sherdog.yml's own daily run stays as-is: with the queue
      # already drained here most days, it's a fast, idempotent safety net
      # for anything left over (a Sherdog outage during this run, a
      # fighter created outside the normal sync flow), and it still feeds
      # its own later steps (history import, refresh, proposals). job_runs:
      # "sherdog_identity" (same job_name sherdog.yml uses -- job_runs is
      # an append-only log, not a once-per-day record, so two rows a day
      # for this job_name is expected, not a conflict).
      - name: Resolve Sherdog identities
        run: npx tsx src/lib/sherdog/runResolveSherdogIdentityJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # D1 + D2 (ARCHITECTURE.md Fork 6): runs after both syncs above, on
      # the same cadence, since it evaluates whatever each source just
      # wrote to its own per-source columns (fights.wikipedia_*/
      # api_sports_*). D1 settles agreements and 24h-timed-out
      # single-source results, queues genuine disagreements; D2 then
      # writes pick_correct/pnl_units onto every pick whose fight just
      # settled.
      - name: Settlement (fights, then picks)
        run: npx tsx src/lib/settlement/runSettlementJobs.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
