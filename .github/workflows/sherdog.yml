name: Sherdog identity + history

on:
  schedule:
    # 03:00 UTC -- after sync.yml's 00:00 run (which creates the
    # upcoming-card fighter rows this job links) and before
    # fighter-enrichment.yml's 06:00 run (so a fighter gets a sherdog_id,
    # and its Sherdog height/weight, before API-Sports enrichment decides
    # what to fetch). Sherdog is unmetered, so unlike the API-Sports jobs
    # there is no quota to schedule around.
    #
    # P7 (ROADMAP_V2.md Phase P): identity resolution (step 1 below) is
    # now ALSO chained directly into sync.yml, right after its own syncs,
    # so a fighter links in the same cycle it's created rather than
    # waiting for this run. This schedule stays as the daily driver for
    # everything else here (history import/refresh, proposals) and as a
    # fast, idempotent safety net for step 1's own queue, which is usually
    # already empty by the time this fires.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# M4: shared with sync.yml and settle.yml -- all three write overlapping
# tables (fighters, fights, and fighter records) and must never run
# concurrently. Queues rather than cancels.
concurrency:
  group: ufc-data-write
  cancel-in-progress: false

jobs:
  sherdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 0b (M5). Re-examine every OPEN low_confidence_sherdog_match
      #     conflict from a PRIOR run against its own already-snapshotted
      #     candidate list -- no new Sherdog search needed. Runs BEFORE
      #     step 1 deliberately (reviewer finding): step 1's own history-
      #     corroboration attempt already re-fetches a fighter's full
      #     candidate set before ever opening a new conflict for it, so
      #     running this sweep afterward would guarantee re-fetching the
      #     identical pages a second time, same run, for every fighter
      #     newly queued today -- pure waste, worse the more candidates a
      #     name has (David Martínez's 20 would cost 40 fetches instead of
      #     20). Running first means this sweep only ever touches
      #     conflicts at least one run old. job_runs:
      #     "sherdog_open_conflict_resolution".
      - name: Auto-resolve open Sherdog match conflicts (history corroboration)
        run: npx tsx src/lib/sherdog/runResolveOpenSherdogConflictsJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 1. Link fighters on newly-announced cards to their Sherdog id.
      #    Auto-matches a confident name hit (guard-verified), runs the
      #    fight-count tie-break on exact-name ties, opens a
      #    low_confidence_sherdog_match conflict otherwise. job_runs:
      #    "sherdog_identity".
      - name: Resolve Sherdog identities
        run: npx tsx src/lib/sherdog/runResolveSherdogIdentityJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 2. Import the full career for any fighter just linked (and not
      #    yet imported). job_runs: "sherdog_history_import".
      - name: Import Sherdog history (new)
        run: npx tsx src/lib/sherdog/runImportSherdogHistoryJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 3. Re-import ~30 already-linked fighters per run, oldest-first, so
      #    a fighter who just fought has fresh bouts (and a fresh record,
      #    step 4) within ~4-5 days without a manual refresh.
      - name: Refresh Sherdog history (cycle the roster)
        run: npx tsx src/lib/sherdog/runImportSherdogHistoryJob.ts --refresh --batch=30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 4. Recount fighter records so any refresh above lands on
      #    fighters.wins/losses/draws. Idempotent; also runs twice daily
      #    inside sync.yml's settlement chain. job_runs: "recompute_records".
      - name: Recompute fighter records
        run: npx tsx src/lib/records/runRecomputeRecordsJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 5 (N4). Propose -- never apply -- a Sherdog match for whatever
      #    low_confidence_sherdog_match conflict is STILL open after every
      #    step above, including any step 0b just declined and any step 1
      #    just opened today. Runs last on purpose so it only ever spends
      #    a call on the real residual, not a conflict about to be
      #    auto-resolved moments later by this same job. Writes only to
      #    conflict_resolution_proposals -- fighters.sherdog_id is never
      #    touched here. job_runs: "conflict_proposals".
      - name: Propose Sherdog match resolutions (advisory only)
        run: npx tsx src/lib/conflictProposals/runScheduledConflictProposalJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 6 (Phase 2, Track A). An independent Groq read on whatever conflict
      #    step 5 just left with a live primary proposal -- deliberately
      #    after it, never before (DECISIONS.md, 2026-09-20), so a second
      #    opinion always has a real primary to compare against. Only
      #    annotates conflict_resolution_proposals; fighters.sherdog_id is
      #    never touched here either. job_runs: "conflict_proposals_second_opinion".
      - name: Propose Sherdog match second opinion (advisory only)
        run: npx tsx src/lib/conflictProposals/runScheduledConflictProposalSecondOpinionJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
