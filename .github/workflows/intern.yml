name: Intern picks job

on:
  schedule:
    # Every 2 hours, matching odds.yml's cadence deliberately. The intern
    # needs a price to anchor on (odds land ~T-12h) and is rejected by the
    # pick-lock trigger once the card starts, so its useful window is
    # exactly the 12 hours between those two moments -- a daily cadence
    # could miss it entirely on a card that prices and starts between
    # runs. No external API cost per run (no LLM, no Bluesky: the pick
    # rule is deterministic), so a tight cadence is free here.
    - cron: "30 */2 * * *"
  workflow_dispatch: {}

# The slate step deletes and re-inserts the card's open INTERN slips; two
# overlapping runs must never interleave that swap (reviewer finding). Same
# guard settle.yml/integrity.yml/sync.yml already use.
concurrency:
  group: intern
  cancel-in-progress: false

jobs:
  intern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Writes one INTERN pick per upcoming fight, revising its own
      # earlier pick when the market or the rumour picture has moved.
      # Recorded in job_runs as "intern_picks".
      - name: Generate intern picks
        run: npx tsx src/lib/intern/runScheduledInternJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Phase T4: rebuilds the nearest card's INTERN slate (value singles,
      # parlays, method legs) from the picks just written, against the
      # Intern's own ₱10,000 paper bankroll. Frozen once the T-6h pick
      # lock passes. Recorded in job_runs as "intern_slate".
      - name: Generate intern slate
        run: npx tsx src/lib/intern/slate/runScheduledInternSlateJob.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
